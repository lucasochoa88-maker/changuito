
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>El Changuito — Comparador de Supermercados</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.4/chart.umd.min.js"></script>
<style>
:root{
  --bg:#131720; --panel:#1B2130; --panel2:#222A3D; --linea:#2C3550;
  --texto:#E8EAF0; --texto2:#9AA3B5; --ticket:#F7F4EC; --ticket-tinta:#23262B;
  --carrefour:#3B82F6; --coto:#E5493C; --jumbo:#2FA84F;
  --oferta:#FFC53D; --alerta:#FF6B6B; --ok:#3DDC97;
  --radio:14px; --sombra:0 8px 28px rgba(0,0,0,.35);
}
[data-tema="claro"]{
  --bg:#EFEDE6; --panel:#FFFFFF; --panel2:#F4F2EC; --linea:#DDD9CE;
  --texto:#23262B; --texto2:#6B7280; --ticket:#FFFFFF; --ticket-tinta:#23262B;
  --sombra:0 8px 24px rgba(35,38,43,.10);
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--texto);font-family:'IBM Plex Sans',sans-serif;font-size:15px;line-height:1.5;transition:background .25s}
.mono{font-family:'IBM Plex Mono',monospace}
.wrap{max-width:1180px;margin:0 auto;padding:22px 18px 60px}

/* ===== header ===== */
header{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:22px}
h1{font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:clamp(38px,6vw,58px);line-height:.95;letter-spacing:.5px;text-transform:uppercase}
h1 .changuito{color:var(--oferta)}
.sub{color:var(--texto2);font-size:13px;margin-top:6px}
.sub .fecha{color:var(--texto);font-weight:600}
.acciones{display:flex;gap:10px}
.boton{background:var(--panel);border:1px solid var(--linea);color:var(--texto);border-radius:10px;padding:9px 14px;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit}
.boton:hover{border-color:var(--texto2)}
.boton:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--oferta);outline-offset:2px}

/* ===== leyenda de supers ===== */
.leyenda{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:18px;font-size:13px;color:var(--texto2)}
.chip{display:inline-flex;align-items:center;gap:7px}
.punto{width:11px;height:11px;border-radius:3px;display:inline-block}

/* ===== fila superior: ticket + kpis ===== */
.tope{display:grid;grid-template-columns:290px 1fr;gap:18px;margin-bottom:22px}
@media(max-width:840px){.tope{grid-template-columns:1fr}}

/* — EL TICKET (firma del dashboard) — */
.ticket{background:var(--ticket);color:var(--ticket-tinta);border-radius:4px;padding:20px 18px 26px;box-shadow:var(--sombra);position:relative;font-family:'IBM Plex Mono',monospace}
.ticket:before,.ticket:after{content:"";position:absolute;left:0;right:0;height:10px;background-image:radial-gradient(circle at 8px -3px, transparent 7px, var(--ticket) 8px);background-size:16px 10px}
.ticket:before{top:-9px;transform:rotate(180deg)}
.ticket:after{bottom:-9px}
.ticket h2{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:20px;text-transform:uppercase;letter-spacing:1px;text-align:center;border-bottom:1.5px dashed #b9b4a6;padding-bottom:10px;margin-bottom:12px}
.t-linea{display:flex;justify-content:space-between;font-size:13px;padding:3.5px 0}
.t-linea span:first-child{color:#6d685c}
.t-total{border-top:1.5px dashed #b9b4a6;margin-top:10px;padding-top:12px;display:flex;justify-content:space-between;align-items:baseline}
.t-total .num{font-size:26px;font-weight:700}
.t-pie{text-align:center;font-size:11px;color:#8d887a;margin-top:14px;letter-spacing:2px}

.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px;align-content:start}
.kpi{background:var(--panel);border:1px solid var(--linea);border-radius:var(--radio);padding:16px}
.kpi .v{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:34px;line-height:1}
.kpi .l{color:var(--texto2);font-size:12.5px;margin-top:6px}
.kpi .d{font-size:12px;margin-top:4px;font-weight:600}
.pos{color:var(--ok)}.neg{color:var(--alerta)}

/* ===== tabs ===== */
.tabs{display:flex;gap:6px;border-bottom:1px solid var(--linea);margin-bottom:20px;overflow-x:auto}
.tab{background:none;border:none;color:var(--texto2);font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:19px;text-transform:uppercase;letter-spacing:.8px;padding:10px 16px;cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap}
.tab.activa{color:var(--texto);border-bottom-color:var(--oferta)}
.pantalla{display:none}.pantalla.activa{display:block}

/* ===== paneles y grillas ===== */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:18px}
@media(max-width:840px){.grid2{grid-template-columns:1fr}}
.panel{background:var(--panel);border:1px solid var(--linea);border-radius:var(--radio);padding:18px;margin-bottom:18px}
.panel h3{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:20px;text-transform:uppercase;letter-spacing:.6px;margin-bottom:12px}
.panel .nota{color:var(--texto2);font-size:12px;margin-top:8px}
.lienzo{position:relative;height:280px}

/* ===== tablas ===== */
.filtros{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
input[type=search],select{background:var(--panel2);border:1px solid var(--linea);color:var(--texto);border-radius:10px;padding:9px 12px;font-size:14px;font-family:inherit;min-width:150px}
.tabla-scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:14px;text-transform:uppercase;letter-spacing:.6px;color:var(--texto2);text-align:left;padding:9px 10px;border-bottom:1px solid var(--linea);white-space:nowrap}
td{padding:9px 10px;border-bottom:1px solid var(--linea);vertical-align:top}
td.num{font-family:'IBM Plex Mono',monospace;white-space:nowrap;text-align:right}
tr:hover td{background:var(--panel2)}
.gana{font-weight:700;position:relative}
.gana:before{content:"";position:absolute;left:0;top:8px;bottom:8px;width:3px;border-radius:2px;background:var(--c,var(--oferta))}
.cat-fila td{font-family:'Barlow Condensed',sans-serif;font-weight:700;text-transform:uppercase;letter-spacing:.8px;font-size:15px;color:var(--texto2);background:var(--panel2)}
.badge{display:inline-block;background:var(--oferta);color:#332a00;border-radius:4px;font-size:11px;font-weight:700;padding:2px 7px;margin-top:3px;transform:rotate(-1.2deg)}
.badge.verificar{background:var(--alerta);color:#fff;transform:none}
.badge.super{transform:none;color:#fff}
.match{color:var(--texto2);font-size:12px;display:block;max-width:260px}

/* ===== estado inicial ===== */
.setup{background:var(--panel);border:1.5px dashed var(--linea);border-radius:var(--radio);padding:34px;text-align:center;max-width:640px;margin:60px auto}
.setup h2{font-family:'Barlow Condensed',sans-serif;font-size:28px;text-transform:uppercase;margin-bottom:10px}
.setup p{color:var(--texto2);font-size:14px;margin-bottom:8px}
.setup code{background:var(--panel2);padding:2px 7px;border-radius:6px;font-size:12.5px}
.cargando{text-align:center;color:var(--texto2);padding:70px 0;font-family:'IBM Plex Mono',monospace}
@media (prefers-reduced-motion: no-preference){
  .kpi,.panel,.ticket{animation:sube .4s ease both}
  @keyframes sube{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
}
</style>
</head>
<body data-tema="oscuro">
<div class="wrap">

<header>
  <div>
    <h1>El <span class="changuito">Changuito</span></h1>
    <div class="sub">Carrefour · Coto · Jumbo — datos de la corrida del <span class="fecha" id="fechaDatos">—</span></div>
  </div>
  <div class="acciones">
    <button class="boton" id="btnTema" aria-label="Cambiar tema">☀️ / 🌙</button>
    <button class="boton" id="btnRecargar">↻ Actualizar datos</button>
  </div>
</header>

<div class="leyenda">
  <span class="chip"><span class="punto" style="background:var(--carrefour)"></span>Carrefour</span>
  <span class="chip"><span class="punto" style="background:var(--coto)"></span>Coto</span>
  <span class="chip"><span class="punto" style="background:var(--jumbo)"></span>Jumbo</span>
  <span class="chip"><span class="punto" style="background:var(--oferta)"></span>Promo activa</span>
</div>

<div id="app"><div class="cargando">Cargando datos del changuito…</div></div>

</div>

<script>
/* =====================================================================
   CONFIGURACIÓN — pegá acá los links CSV publicados de cada pestaña
   (Archivo → Compartir → Publicar en la web → elegir pestaña → CSV)
   ===================================================================== */
var CSV_COMPARACION = 'PEGAR_URL_CSV_COMPARACION';
var CSV_HISTORICO   = 'PEGAR_URL_CSV_HISTORICO';   // opcional
var CSV_OFERTAS     = 'PEGAR_URL_CSV_OFERTAS';     // opcional

var SUPERS = ['Carrefour','Coto','Jumbo'];
var COLORES = {}; // se llena según tema (canvas no lee variables CSS)
var charts = {}, D = { comp:[], hist:[], ofertas:[] };

function coloresTema(){
  var claro = document.body.dataset.tema === 'claro';
  COLORES = {
    Carrefour:'#3B82F6', Coto:'#E5493C', Jumbo:'#2FA84F',
    oferta:'#FFC53D', texto: claro ? '#23262B' : '#E8EAF0',
    grilla: claro ? 'rgba(35,38,43,.09)' : 'rgba(232,234,240,.09)',
    texto2: claro ? '#6B7280' : '#9AA3B5'
  };
}
function precio(v){
  if (v === null || v === undefined || v === '') return null;
  if (typeof v === 'number') return v;
  var n = parseFloat(String(v).replace(/[$\s]/g,'').replace(/,/g,''));
  return isNaN(n) ? null : n;
}
function fmt(n){ return n === null ? '—' : '$' + n.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2}); }
function fmtK(n){ return '$' + Math.round(n).toLocaleString('en-US'); }

function cargarCSV(url){
  return new Promise(function(res){
    if (!url || url.indexOf('http') !== 0) return res([]);
    Papa.parse(url + (url.indexOf('?')>=0?'&':'?') + 'nocache=' + Date.now(), {
      download:true, header:true, skipEmptyLines:true,
      complete:function(r){ res(r.data || []); }, error:function(){ res([]); }
    });
  });
}

function iniciar(){
  coloresTema();
  if (CSV_COMPARACION.indexOf('http') !== 0){
    document.getElementById('app').innerHTML =
      '<div class="setup"><h2>Falta conectar tu planilla</h2>' +
      '<p>Abrí este archivo y pegá los links CSV publicados en las constantes de arriba:</p>' +
      '<p><code>CSV_COMPARACION</code> (obligatorio) · <code>CSV_HISTORICO</code> y <code>CSV_OFERTAS</code> (opcionales)</p>' +
      '<p>En tu Google Sheet: Archivo → Compartir → Publicar en la web → elegís la pestaña → formato CSV.</p></div>';
    return;
  }
  Promise.all([cargarCSV(CSV_COMPARACION), cargarCSV(CSV_HISTORICO), cargarCSV(CSV_OFERTAS)])
    .then(function(r){
      D.comp = r[0].filter(function(f){ return f['Producto'] && String(f['Categoría']||'').indexOf('SUBTOTAL') !== 0; });
      D.hist = r[1].filter(function(f){ return f['Producto']; });
      D.ofertas = r[2].filter(function(f){ return f['Producto']; });
      render();
    });
}

/* ============================ RENDER ============================ */
function render(){
  var app = document.getElementById('app');
  if (!D.comp.length){
    app.innerHTML = '<div class="setup"><h2>Sin datos todavía</h2><p>Corré el comparador en tu planilla (menú 🛒 → ▶️ Comparar todo) y volvé a actualizar.</p></div>';
    return;
  }
  var m = metricas();
  document.getElementById('fechaDatos').textContent = m.fecha || 'última corrida';

  app.innerHTML =
    '<div class="tope">' + htmlTicket(m) + htmlKpis(m) + '</div>' +
    '<div class="tabs" role="tablist">' +
      ['Resumen','Comparación','Histórico','Ofertas'].map(function(t,i){
        return '<button class="tab'+(i===0?' activa':'')+'" data-tab="'+t+'" role="tab">'+t+'</button>';
      }).join('') +
    '</div>' +
    '<div class="pantalla activa" id="tab-Resumen">' +
      '<div class="grid2"><div class="panel"><h3>Si comprás todo en un solo super</h3><div class="lienzo"><canvas id="chSolo"></canvas></div><p class="nota" id="notaSolo"></p></div>' +
      '<div class="panel"><h3>Quién gana cada producto</h3><div class="lienzo"><canvas id="chGana"></canvas></div></div></div>' +
      '<div class="panel"><h3>Gasto óptimo por categoría</h3><div class="lienzo"><canvas id="chCat"></canvas></div></div>' +
    '</div>' +
    '<div class="pantalla" id="tab-Comparación">' +
      '<div class="filtros"><input type="search" id="fBusca" placeholder="Buscar producto…">' +
      '<select id="fCat"><option value="">Todas las categorías</option></select></div>' +
      '<div class="tabla-scroll"><table id="tComp"></table></div>' +
    '</div>' +
    '<div class="pantalla" id="tab-Histórico">' + (D.hist.length ?
      '<div class="grid2"><div class="panel"><h3>Evolución del producto</h3>' +
      '<div class="filtros"><select id="fProd"></select></div><div class="lienzo"><canvas id="chProd"></canvas></div></div>' +
      '<div class="panel"><h3>Índice changuito (mejor precio)</h3><div class="lienzo"><canvas id="chIndice"></canvas></div>' +
      '<p class="nota">Suma del mejor precio por producto en cada corrida (solo productos presentes en todas las corridas).</p></div></div>' +
      '<div class="panel"><h3>Mayores movimientos desde la primera corrida</h3><div class="tabla-scroll"><table id="tMov"></table></div></div>'
      : '<div class="setup"><h2>Histórico vacío</h2><p>Se llena solo con cada corrida mensual del comparador. Con 2+ corridas vas a ver la evolución acá.</p></div>') +
    '</div>' +
    '<div class="pantalla" id="tab-Ofertas">' + (D.ofertas.length ?
      '<div class="filtros"><select id="fSuperOf"><option value="">Los 3 supers</option>' +
      SUPERS.map(function(s){return '<option>'+s+'</option>';}).join('') + '</select>' +
      '<select id="fLista"><option value="">Todas las ofertas</option><option value="si">Solo productos de mi lista</option></select></div>' +
      '<div class="tabla-scroll"><table id="tOfertas"></table></div>'
      : '<div class="setup"><h2>Sin ofertas cargadas</h2><p>En tu planilla: menú 🛒 → 🏷️ Actualizar Ofertas, publicá la pestaña como CSV y pegá el link en <code>CSV_OFERTAS</code>.</p></div>') +
    '</div>';

  eventos(); graficos(m); tablaComparacion(); tablaOfertas(); historico();
}

/* ============================ MÉTRICAS ============================ */
function metricas(){
  var m = { fecha:'', totalOptimo:0, promos:0, productos:D.comp.length,
            gana:{Carrefour:0,Coto:0,Jumbo:0}, porCat:{}, soloSuper:{}, interseccion:0 };
  var completos = [];
  D.comp.forEach(function(f){
    var fin = precio(f['PRECIO FINAL C/PAGO']) !== null ? precio(f['PRECIO FINAL C/PAGO']) : precio(f['MEJOR PRECIO']);
    if (fin !== null){
      m.totalOptimo += fin;
      var cat = f['Categoría'] || 'Sin categoría';
      m.porCat[cat] = (m.porCat[cat] || 0) + fin;
    }
    if (f['MEJOR SUPER'] && m.gana[f['MEJOR SUPER']] !== undefined) m.gana[f['MEJOR SUPER']]++;
    var conPromo = SUPERS.some(function(s){
      var p = f[s + ' promo'] || '';
      return p && !/^Tarjeta Carrefour/i.test(p);
    });
    if (conPromo) m.promos++;
    var precios = {};
    SUPERS.forEach(function(s){ var v = precio(f[s + ' final']); if (v !== null) precios[s] = v; });
    if (Object.keys(precios).length === 3) completos.push(precios);
  });
  m.interseccion = completos.length;
  SUPERS.forEach(function(s){
    m.soloSuper[s] = completos.reduce(function(a,p){ return a + p[s]; }, 0);
  });
  m.mixOptimo = completos.reduce(function(a,p){ return a + Math.min(p.Carrefour, p.Coto, p.Jumbo); }, 0);
  var peorSolo = Math.max.apply(null, SUPERS.map(function(s){ return m.soloSuper[s]; }));
  var mejorSolo = Math.min.apply(null, SUPERS.map(function(s){ return m.soloSuper[s]; }));
  m.ahorroMezcla = mejorSolo - m.mixOptimo;
  m.ahorroVsPeor = peorSolo - m.mixOptimo;
  if (D.hist.length) m.fecha = D.hist[D.hist.length - 1]['Fecha'] || '';
  return m;
}

function htmlTicket(m){
  var lineas = SUPERS.map(function(s){
    return '<div class="t-linea"><span>Todo en ' + s + ' (' + m.interseccion + ' prod.)</span><span>' + fmtK(m.soloSuper[s]) + '</span></div>';
  }).join('');
  return '<div class="ticket"><h2>Ticket del mes</h2>' + lineas +
    '<div class="t-linea"><span>Mezclando supers</span><span>' + fmtK(m.mixOptimo) + '</span></div>' +
    '<div class="t-total"><span>TOTAL ÓPTIMO</span><span class="num">' + fmtK(m.totalOptimo) + '</span></div>' +
    '<div class="t-pie">* * * GRACIAS POR SU COMPRA * * *</div></div>';
}
function htmlKpis(m){
  return '<div class="kpis">' +
    '<div class="kpi"><div class="v">' + m.productos + '</div><div class="l">productos comparados</div></div>' +
    '<div class="kpi"><div class="v">' + m.promos + '</div><div class="l">con promo activa</div></div>' +
    '<div class="kpi"><div class="v">' + fmtK(m.ahorroMezcla) + '</div><div class="l">ahorro por mezclar vs el mejor super único</div><div class="d pos">sobre ' + m.interseccion + ' productos comparables</div></div>' +
    '<div class="kpi"><div class="v">' + fmtK(m.ahorroVsPeor) + '</div><div class="l">ahorro vs comprar todo en el más caro</div></div>' +
  '</div>';
}

/* ============================ GRÁFICOS ============================ */
function destruir(id){ if (charts[id]) { charts[id].destroy(); delete charts[id]; } }
function graficos(m){
  destruir('chSolo');
  charts.chSolo = new Chart(document.getElementById('chSolo'), {
    type:'bar',
    data:{ labels: SUPERS.concat(['Mezcla óptima']),
      datasets:[{ data: SUPERS.map(function(s){return m.soloSuper[s];}).concat([m.mixOptimo]),
        backgroundColor: SUPERS.map(function(s){return COLORES[s];}).concat([COLORES.oferta]), borderRadius:6 }]},
    options: opts({ indexAxis:'y' })
  });
  document.getElementById('notaSolo').textContent =
    'Comparación justa: solo los ' + m.interseccion + ' productos con precio en los 3 supers.';
  destruir('chGana');
  charts.chGana = new Chart(document.getElementById('chGana'), {
    type:'doughnut',
    data:{ labels:SUPERS, datasets:[{ data:SUPERS.map(function(s){return m.gana[s];}),
      backgroundColor:SUPERS.map(function(s){return COLORES[s];}), borderWidth:0 }]},
    options:{ plugins:{ legend:{ position:'bottom', labels:{ color:COLORES.texto } } }, cutout:'62%' }
  });
  var cats = Object.keys(m.porCat).sort(function(a,b){ return m.porCat[b]-m.porCat[a]; });
  destruir('chCat');
  charts.chCat = new Chart(document.getElementById('chCat'), {
    type:'bar',
    data:{ labels:cats, datasets:[{ data:cats.map(function(c){return m.porCat[c];}),
      backgroundColor:COLORES.oferta, borderRadius:6 }]},
    options: opts({})
  });
}
function opts(extra){
  var o = { responsive:true, maintainAspectRatio:false,
    plugins:{ legend:{ display:false },
      tooltip:{ callbacks:{ label:function(c){ return ' ' + fmtK(c.parsed.y !== undefined && c.parsed.y !== null ? (extra.indexAxis==='y'?c.parsed.x:c.parsed.y) : c.parsed); } } } },
    scales:{ x:{ ticks:{ color:COLORES.texto2 }, grid:{ color:COLORES.grilla } },
             y:{ ticks:{ color:COLORES.texto2 }, grid:{ color:COLORES.grilla } } } };
  for (var k in extra) o[k] = extra[k];
  return o;
}

/* ============================ COMPARACIÓN ============================ */
function tablaComparacion(){
  var sel = document.getElementById('fCat');
  var cats = {};
  D.comp.forEach(function(f){ cats[f['Categoría'] || 'Sin categoría'] = 1; });
  Object.keys(cats).sort().forEach(function(c){
    var o = document.createElement('option'); o.textContent = c; sel.appendChild(o);
  });
  pintarComparacion();
}
function pintarComparacion(){
  var q = (document.getElementById('fBusca').value || '').toLowerCase();
  var cat = document.getElementById('fCat').value;
  var html = '<tr><th>Producto</th>' + SUPERS.map(function(s){return '<th style="text-align:right">'+s+'</th>';}).join('') +
             '<th>Mejor pagando con</th><th style="text-align:right">Final</th></tr>';
  var catAct = null;
  D.comp.forEach(function(f){
    var c = f['Categoría'] || 'Sin categoría';
    if (cat && c !== cat) return;
    if (q && f['Producto'].toLowerCase().indexOf(q) < 0) return;
    if (c !== catAct && !q){ html += '<tr class="cat-fila"><td colspan="6">' + c + '</td></tr>'; catAct = c; }
    var precios = {};
    SUPERS.forEach(function(s){ precios[s] = precio(f[s + ' final']); });
    var min = Math.min.apply(null, SUPERS.map(function(s){ return precios[s] === null ? Infinity : precios[s]; }));
    html += '<tr><td><strong>' + f['Producto'] + '</strong></td>';
    SUPERS.forEach(function(s){
      var p = precios[s], promo = f[s + ' promo'] || '';
      var celda = p === null ? '<span style="color:var(--texto2)">—</span>' : fmt(p);
      var badges = '';
      if (/VERIFICAR/i.test(promo)) badges += '<span class="badge verificar">verificar</span> ';
      else if (promo && !/^Tarjeta Carrefour/i.test(promo)) badges += '<span class="badge">' + promo.split('(')[0].trim().slice(0,26) + '</span>';
      var clase = (p !== null && p === min) ? ' class="num gana" style="--c:var(--' + s.toLowerCase() + ')"' : ' class="num"';
      html += '<td' + clase + '>' + celda + (badges ? '<br>' + badges : '') + '</td>';
    });
    html += '<td style="font-size:12.5px">' + (f['MEJOR PAGANDO CON'] || '—') + '</td>' +
            '<td class="num"><strong>' + fmt(precio(f['PRECIO FINAL C/PAGO']) !== null ? precio(f['PRECIO FINAL C/PAGO']) : precio(f['MEJOR PRECIO'])) + '</strong></td></tr>';
  });
  document.getElementById('tComp').innerHTML = html;
}

/* ============================ HISTÓRICO ============================ */
function historico(){
  if (!D.hist.length) return;
  var porProd = {}, fechas = {};
  D.hist.forEach(function(f){
    fechas[f['Fecha']] = 1;
    var k = f['Producto'];
    porProd[k] = porProd[k] || {};
    porProd[k][f['Fecha']] = porProd[k][f['Fecha']] || {};
    porProd[k][f['Fecha']][f['Super']] = precio(f['Precio final']);
  });
  var listaFechas = Object.keys(fechas).sort();
  var sel = document.getElementById('fProd');
  Object.keys(porProd).sort().forEach(function(p){
    var o = document.createElement('option'); o.textContent = p; sel.appendChild(o);
  });
  sel.onchange = function(){ lineaProducto(porProd, listaFechas, sel.value); };
  lineaProducto(porProd, listaFechas, sel.value);

  // índice changuito: mejor precio por producto en cada fecha
  var completos = Object.keys(porProd).filter(function(p){
    return listaFechas.every(function(f){ return porProd[p][f]; });
  });
  var indice = listaFechas.map(function(f){
    return completos.reduce(function(a,p){
      var vals = SUPERS.map(function(s){ return porProd[p][f][s]; }).filter(function(v){ return v !== null && v !== undefined; });
      return a + (vals.length ? Math.min.apply(null, vals) : 0);
    }, 0);
  });
  destruir('chIndice');
  charts.chIndice = new Chart(document.getElementById('chIndice'), {
    type:'line',
    data:{ labels:listaFechas, datasets:[{ data:indice, borderColor:COLORES.oferta,
      backgroundColor:'transparent', tension:.25, pointRadius:4 }]},
    options: opts({})
  });

  // movimientos primera vs última corrida
  if (listaFechas.length > 1){
    var f0 = listaFechas[0], f1 = listaFechas[listaFechas.length - 1], movs = [];
    completos.forEach(function(p){
      function minDe(f){ var v = SUPERS.map(function(s){return porProd[p][f][s];}).filter(function(x){return x!==null&&x!==undefined;}); return v.length?Math.min.apply(null,v):null; }
      var a = minDe(f0), b = minDe(f1);
      if (a && b) movs.push({ p:p, var:(b-a)/a*100, de:a, a:b });
    });
    movs.sort(function(x,y){ return Math.abs(y.var) - Math.abs(x.var); });
    var html = '<tr><th>Producto</th><th style="text-align:right">' + f0 + '</th><th style="text-align:right">' + f1 + '</th><th style="text-align:right">Variación</th></tr>';
    movs.slice(0,10).forEach(function(x){
      html += '<tr><td>' + x.p + '</td><td class="num">' + fmt(x.de) + '</td><td class="num">' + fmt(x.a) + '</td>' +
        '<td class="num ' + (x.var >= 0 ? 'neg' : 'pos') + '">' + (x.var >= 0 ? '+' : '') + x.var.toFixed(1) + '%</td></tr>';
    });
    document.getElementById('tMov').innerHTML = html;
  } else {
    document.getElementById('tMov').innerHTML = '<tr><td style="color:var(--texto2)">Con la próxima corrida mensual aparecen las variaciones acá.</td></tr>';
  }
}
function lineaProducto(porProd, fechas, prod){
  destruir('chProd');
  charts.chProd = new Chart(document.getElementById('chProd'), {
    type:'line',
    data:{ labels:fechas, datasets: SUPERS.map(function(s){
      return { label:s, data:fechas.map(function(f){ return (porProd[prod][f]||{})[s] !== undefined ? porProd[prod][f][s] : null; }),
        borderColor:COLORES[s], backgroundColor:'transparent', tension:.25, pointRadius:4, spanGaps:true };
    })},
    options:{ responsive:true, maintainAspectRatio:false,
      plugins:{ legend:{ labels:{ color:COLORES.texto } } },
      scales:{ x:{ ticks:{ color:COLORES.texto2 }, grid:{ color:COLORES.grilla } },
               y:{ ticks:{ color:COLORES.texto2 }, grid:{ color:COLORES.grilla } } } }
  });
}

/* ============================ OFERTAS ============================ */
function tablaOfertas(){
  if (!D.ofertas.length) return;
  document.getElementById('fSuperOf').onchange = pintarOfertas;
  document.getElementById('fLista').onchange = pintarOfertas;
  pintarOfertas();
}
function pintarOfertas(){
  var s = document.getElementById('fSuperOf').value;
  var soloLista = document.getElementById('fLista').value === 'si';
  var html = '<tr><th>Super</th><th>Producto</th><th style="text-align:right">Lista</th><th style="text-align:right">Oferta</th><th style="text-align:right">% Dto</th><th>Promo</th><th>De tu lista</th></tr>';
  D.ofertas.forEach(function(f){
    if (s && f['Super'] !== s) return;
    if (soloLista && !f['En tu Lista']) return;
    var dto = f['% Dto'];
    var dtoN = dto ? (String(dto).indexOf('%') >= 0 ? parseFloat(dto) : parseFloat(dto) * 100) : 0;
    html += '<tr><td><span class="badge super" style="background:var(--' + String(f['Super']).toLowerCase() + ')">' + f['Super'] + '</span></td>' +
      '<td>' + f['Producto'] + '</td>' +
      '<td class="num">' + fmt(precio(f['Precio lista'])) + '</td>' +
      '<td class="num"><strong>' + fmt(precio(f['Precio oferta'])) + '</strong></td>' +
      '<td class="num">' + (dtoN ? dtoN.toFixed(0) + '%' : '—') + '</td>' +
      '<td style="font-size:12.5px">' + (f['Promo'] || '') + '</td>' +
      '<td>' + (f['En tu Lista'] ? '<span class="badge">' + f['En tu Lista'] + '</span>' : '') + '</td></tr>';
  });
  document.getElementById('tOfertas').innerHTML = html;
}

/* ============================ EVENTOS ============================ */
function eventos(){
  document.querySelectorAll('.tab').forEach(function(b){
    b.onclick = function(){
      document.querySelectorAll('.tab').forEach(function(x){ x.classList.remove('activa'); });
      document.querySelectorAll('.pantalla').forEach(function(x){ x.classList.remove('activa'); });
      b.classList.add('activa');
      document.getElementById('tab-' + b.dataset.tab).classList.add('activa');
    };
  });
  document.getElementById('fBusca').oninput = pintarComparacion;
  document.getElementById('fCat').onchange = pintarComparacion;
}
document.getElementById('btnTema').onclick = function(){
  document.body.dataset.tema = document.body.dataset.tema === 'claro' ? 'oscuro' : 'claro';
  coloresTema(); render();
};
document.getElementById('btnRecargar').onclick = iniciar;
iniciar();
